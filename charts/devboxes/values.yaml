nameOverride: ""
fullnameOverride: ""

controller:
  replicaCount: 1
  image:
    repository: ghcr.io/vicotrbb/devboxes-controller
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  existingSecret: devboxes-auth
  accessTokenKey: access-token
  externalUrl: http://127.0.0.1:8000
  displayName: operator
  clusterName: Kubernetes
  cookieSecure: false
  defaultTtlHours: 24
  maxTtlHours: 168
  cleanupIntervalSeconds: 60
  sessionTtlSeconds: 43200
  authorizationCodeTtlSeconds: 120
  authorizationCodeStoreSize: 1024
  cliTokenTtlSeconds: 2592000
  # Optional key in controller.existingSecret. Empty derives a domain-separated
  # signing key from accessTokenKey so no new mandatory credential is required.
  cliSigningKeyKey: ""
  logLevel: INFO
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Multi-tenancy is opt-in so existing installations retain their single-operator
# behavior. When enabled, each tenant is an authorization and Kubernetes namespace
# boundary. Principal tokens are read from an existing Secret and are never stored
# in Helm values.
tenancy:
  enabled: false
  defaultTenant: default
  existingPrincipalSecret: ""
  principalTokenMountPath: /var/run/secrets/devboxes/principals
  networkPolicy:
    # Restrict tenant workspace ingress to SSH. Egress remains available for
    # repositories, package registries, and the Insights controller.
    enabled: true
  # Example:
  # tenants:
  #   - id: platform
  #     displayName: Platform Engineering
  #     namespace: devboxes-platform
  #     createNamespace: true
  #     namespaceLabels:
  #       owner: platform
  #     workspaceSecretName: devboxes-workspace
  #     workspaceServiceAccountName: devboxes-workspace
  #     storageClass: fast-rwo
  #     maxTtlHours: 72
  #     allowedPresets: [small, medium]
  #     allowedGpuProfiles: [nvidia-l4]
  #     defaultGpuProfile: nvidia-l4
  #     allowedImageProfiles: []
  #     resourceQuota:
  #       enabled: true
  #       hard:
  #         requests.cpu: "8"
  #         requests.memory: 32Gi
  #         requests.storage: 500Gi
  #         count/deployments.apps: "10"
  #         count/pods: "10"
  tenants: []
  # Example principal. Create existingPrincipalSecret in the controller namespace
  # with a key matching tokenKey and at least 32 random characters.
  # principals:
  #   - subject: alice
  #     displayName: Alice
  #     tokenKey: alice-token
  #     defaultTenant: platform
  #     memberships:
  #       - tenant: platform
  #         role: admin
  principals: []

workspace:
  image:
    repository: ghcr.io/vicotrbb/devboxes-workspace
    tag: ""
  # Custom images are opt-in and operator-owned. A sidecar profile runs a
  # compatible non-root application image beside the prepared Devboxes workspace.
  # A workspace profile replaces it and must preserve the complete SSH contract.
  customImages:
    enabled: false
    # Example profile fields:
    # - name: nginx
    #   displayName: NGINX preview
    #   description: Serve a local static-site preview over the pod network
    #   image: docker.io/nginxinc/nginx-unprivileged:1.27.5-alpine
    #   mode: sidecar
    #   pullPolicy: IfNotPresent
    #   resources:
    #     cpuRequest: 25m
    #     memoryRequest: 32Mi
    #     cpuLimit: 500m
    #     memoryLimit: 512Mi
    #   ports:
    #     - name: http
    #       containerPort: 8080
    #       protocol: TCP
    profiles: []
  existingSecret: devboxes-workspace
  imagePullSecret: ""
  storageClass: ""
  priorityClassName: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  sshService:
    type: LoadBalancer
    host: ""
    annotations: {}
    loadBalancerClass: ""
    externalTrafficPolicy: Cluster
    loadBalancerSourceRanges: []

# GPU acceleration is opt-in. Each profile maps a stable user-facing name to
# one device-plugin or DRA-bridged extended resource and trusted scheduling policy.
gpu:
  enabled: false
  defaultProfile: ""
  # Example profile fields:
  # - name: nvidia-l4
  #   displayName: NVIDIA L4
  #   description: One dedicated GPU
  #   resourceName: nvidia.com/gpu
  #   count: 1
  #   workspaceImage: registry.example/devboxes-workspace-cuda:12.8
  #   runtimeClassName: nvidia
  #   supplementalGroups: []
  #   nodeSelector:
  #     accelerator: nvidia-l4
  #   tolerations:
  #     - key: nvidia.com/gpu
  #       operator: Exists
  #       effect: NoSchedule
  profiles: []

insights:
  enabled: false
  # Optional key in controller.existingSecret. Empty derives a dedicated,
  # domain-separated ingest key without exposing the master or CLI key.
  signingKeyKey: ""
  storage:
    existingClaim: ""
    storageClass: ""
    size: 2Gi
    warningBytes: 1717986918
    accessMode: ReadWriteOnce
    retainOnDelete: true
  retention:
    rawDays: 30
    hourlyDays: 90
    dailyDays: 365
  agent:
    scanIntervalSeconds: 60
    repositoryDepth: 4
    maxQueueBytes: 134217728
    maxQueueAgeSeconds: 604800

service:
  type: ClusterIP
  port: 8000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: devboxes.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
